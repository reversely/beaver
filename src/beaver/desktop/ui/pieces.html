<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beaver pieces</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    .gallery { max-width: 1100px; margin: 32px auto; padding: 24px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--ring); }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 16px; }
    .gallery-card figcaption { overflow-wrap: anywhere; }
    .gallery-card { background: var(--surface-raised); box-shadow: var(--ring); border-radius: var(--radius); padding: 12px; text-align: center; }
    .gallery-card img { width: 100%; aspect-ratio: 1; background: linear-gradient(180deg, #a9c3d6, #f1d3b3); border-radius: 10px; }
    .checks { margin-top: 24px; columns: 2 280px; font-size: 14px; color: var(--ink-2); }
  </style>
</head>
<body>
  <main class="gallery">
    <h1>Pieces</h1>
    <div class="gallery-grid" id="grid"></div>
    <ul class="checks" id="checks"></ul>
  </main>
  <script src="background.js"></script>
  <script type="module">
    import { PIECES, runChecks } from "./artifact-specs.js";
    import { artifactImage } from "./artifacts.js";
    const grid = document.getElementById("grid");
    const started = performance.now();
    for (const piece of PIECES) {
      const card = document.createElement("figure");
      card.className = "gallery-card";
      const image = document.createElement("img");
      image.alt = piece;
      const pieceStart = performance.now();
      image.src = artifactImage(piece, Number(new URLSearchParams(location.search).get("size") ?? 400));
      const caption = document.createElement("figcaption");
      caption.textContent = `${piece} ${(performance.now() - pieceStart).toFixed(0)} ms`;
      card.append(image, caption);
      grid.append(card);
    }
    const elapsed = performance.now() - started;
    const timing = document.createElement("p");
    timing.textContent = `${PIECES.length} pieces rendered in ${elapsed.toFixed(0)} ms`;
    grid.after(timing);
    const checks = document.getElementById("checks");
    for (const { name, pass } of runChecks()) {
      const item = document.createElement("li");
      item.textContent = `${pass ? "pass" : "FAIL"} ${name}`;
      checks.append(item);
    }
    document.body.dataset.ready = "true";
  </script>
</body>
</html>
