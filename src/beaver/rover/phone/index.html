<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beaver</title>
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <main>
      <h1>Beaver</h1>
      <label class="language" for="language">
        <span>Language</span>
        <select id="language">
          <option value="auto">Detect automatically</option>
          <option value="en" lang="en">English</option>
          <option value="fr" lang="fr">Français</option>
          <option value="es" lang="es">Español</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="zh" lang="zh">中文</option>
          <option value="pa" lang="pa">ਪੰਜਾਬੀ</option>
          <option value="tl" lang="tl">Tagalog</option>
          <option value="uk" lang="uk">Українська</option>
        </select>
      </label>
      <button id="locate" class="locate" type="button" hidden>Use my location</button>
      <p id="status" role="status" aria-live="polite">
        Hold the button while you ask your question. Beaver answers through the rover's speaker.
      </p>
      <button id="talk" type="button">Hold to talk</button>
      <section id="answer" hidden>
        <h2>Beaver's answer</h2>
        <div id="reply"></div>
      </section>
    </main>
    <script src="phone.js"></script>
  </body>
</html>
