[project]
name = "beaver"
version = "0.1.0"
description = "A multilingual guide to Canada: a rover that answers questions aloud, and a desktop app that keeps what was learned."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/beaver holds the shared core and both apps; installing it lets each app import beaver.core.
module-name = "beaver"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "ruff==0.16.9",
]
rover = [
    "ctranslate2>=4.8.2",
    "elevenlabs>=2.69.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.25.0",
    "numpy>=2.5.3",
    "openwakeword>=0.6.0",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "segno>=1.6.6",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
]
desktop = [
    "ctranslate2>=4.8.2",
    "elevenlabs>=2.69.0",
    "google-genai>=2.25.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pyshp>=3.1.6",
    "python-dotenv>=1.2.3",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
]

[tool.uv]
# openwakeword requires tflite-runtime on Linux, which has no Python 3.13 builds. The rover runs
# openwakeword on onnxruntime instead. This override limits tflite-runtime to Python
# versions below the project's 3.13 floor, so uv never installs it.
override-dependencies = ["tflite-runtime; python_version < '3.12'"]

[tool.ruff]
# Each app folder runs as its own script root, so its own modules (notebooks, phone, ...) are
# first-party imports there, alongside the installed beaver package.
src = [".", "src", "src/beaver/*"]
