# Mechanical, deterministic checks only. Judgment calls (data-structure fit, module boundaries,
# whether a complex change explains itself) aren't enforceable here; see the clean-code skill.
#
# Setup in a new repo:
#   uv add --dev pre-commit detect-secrets
#   uv run pre-commit install
#   uv run detect-secrets scan > .secrets.baseline

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: local
    hooks:
      - id: artifact-specs
        name: artifact registry matches its spec
        entry: node --test experiments/001-gemini-elevenlabs/tests/artifacts.test.mjs
        language: system
        pass_filenames: false
        files: ^experiments/001-gemini-elevenlabs/(artifacts\.md|notebooks\.py|ui/artifact-specs\.js|tests/)
