ext x="974" y="162" text-anchor="start" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">questions</text><polyline points="1018,295 922,390" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="974" y="382" text-anchor="start" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">each sentence</text><polyline points="470,330 470,540 1130,540 1130,332" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)"/><text x="800" y="530" text-anchor="middle" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">pulls each saved turn over SSH, every 60 s</text></svg>
