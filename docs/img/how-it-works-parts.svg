<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The parts of Beaver. The phone reaches the rover through an HTTPS tunnel. The rover sends Gemini redacted text and a camera frame, and ElevenLabs the checked reply. The desktop app asks Gemini and ElevenLabs its own questions and pulls each rover turn over SSH every 60 seconds."><title>The parts of Beaver. The phone reaches the rover through an HTTPS tunnel. The rover sends Gemini redacted text and a camera frame, and ElevenLabs the checked reply. The desktop app asks Gemini and ElevenLabs its own questions and pulls each rover turn over SSH every 60 seconds.</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs><rect width="1280" height="570" fill="#ffffff"/><rect x="40" y="190" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(128.0,210) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" /> <path d="M11 4h2" /> <path d="M12 17v.01" /></g><text x="150.0" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Phone</text><text x="150.0" y="306" text-anchor="middle" font-size="14" fill="#59636e">the visitor asks here</text><rect x="360" y="190" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(448.0,210) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4" /> <path d="M12 2v2" /> <path d="M9 12v9" /> <path d="M15 12v9" /> <path d="M5 16l4 -2" /> <path d="M15 14l4 2" /> <path d="M9 18h6" /> <path d="M10 8v.01" /> <path d="M14 8v.01" /></g><text x="470.0" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Rover</text><text x="470.0" y="306" text-anchor="middle" font-size="14" fill="#59636e">Raspberry Pi 5</text><rect x="700" y="40" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(788.0,60) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6" /></g><text x="810.0" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Gemini</text><text x="810.0" y="156" text-anchor="middle" font-size="14" fill="#59636e">writes the answer</text><rect x="700" y="340" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(788.0,360) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a3 3 0 0 1 0 6" /> <path d="M10 8v11a1 1 0 0 1 -1 1h-1a1 1 0 0 1 -1 -1v-5" /> <path d="M12 8l4.524 -3.77a.9 .9 0 0 1 1.476 .692v12.156a.9 .9 0 0 1 -1.476 .692l-4.524 -3.77h-8a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h8" /></g><text x="810.0" y="432" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">ElevenLabs</text><text x="810.0" y="456" text-anchor="middle" font-size="14" fill="#59636e">speaks 