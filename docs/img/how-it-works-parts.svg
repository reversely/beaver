<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 590" width="1580" height="590" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The parts of Beaver. The phone reaches the rover through an HTTPS tunnel. On the Pi, the privacy gate transcribes the question with Whisper and redacts it with guard.py, so Gemini receives redacted text and a camera frame and ElevenLabs the checked reply. The desktop app asks Gemini and ElevenLabs its own questions without a gate yet, and pulls each rover turn over SSH every 60 seconds."><title>The parts of Beaver. The phone reaches the rover through an HTTPS tunnel. On the Pi, the privacy gate transcribes the question with Whisper and redacts it with guard.py, so Gemini receives redacted text and a camera frame and ElevenLabs the checked reply. The desktop app asks Gemini and ElevenLabs its own questions without a gate yet, and pulls each rover turn over SSH every 60 seconds.</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs><rect width="1580" height="590" fill="#ffffff"/><rect x="320" y="150" width="580" height="220" rx="20" fill="#e9f5ec"/><text x="340" y="180" font-size="15" font-weight="700" letter-spacing="0.6" fill="#1a7f37">ON THE PI, LOCAL</text><rect x="40" y="190" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(128.0,210) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" /> <path d="M11 4h2" /> <path d="M12 17v.01" /></g><text x="150.0" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Phone</text><text x="150.0" y="306" text-anchor="middle" font-size="14" fill="#59636e">the visitor asks here</text><rect x="340" y="205" width="220" height="125" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(428.0,225) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4" /> <path d="M12 2v2" /> <path d="M9 12v9" /> <path d="M15 12v9" /> <path d="M5 16l4 -2" /> <path d="M15 14l4 2" /> <path d="M9 18h6" /> <path d="M10 8v.01" /> <path d="M14 8v.01" /></g><text x="450.0" y="297" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Rover</text><text x="450.0" y="321" text-anchor="middle" font-size="14" fill="#59636e">camera, speaker</text><rect x="640" y="205" width="220" height="125" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(728.0,225) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" /> <path d="M11 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /> <path d="M12 12l0 2.5" /></g><text x="750.0" y="297" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Privacy gate</text><text x="750.0" y="321" text-anchor="middle" font-size="14" fill="#59636e">Whisper + guard.py</text><rect x="1000" y="40" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(1088.0,60) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6" /></g><text x="1110.0" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Gemini</text><text x="1110.0" y="156" text-anchor="middle" font-size="14" fill="#59636e">writes the answer</text><rect x="1000" y="340" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(1088.0,360) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a3 3 0 0 1 0 6" /> <path d="M10 8v11a1 1 0 0 1 -1 1h-1a1 1 0 0 1 -1 -1v-5" /> <path d="M12 8l4.524 -3.77a.9 .9 0 0 1 1.476 .692v12.156a.9 .9 0 0 1 -1.476 .692l-4.524 -3.77h-8a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h8" /></g><text x="1110.0" y="432" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">ElevenLabs</text><text x="1110.0" y="456" text-anchor="middle" font-size="14" fill="#59636e">speaks the answer</text><rect x="1320" y="190" width="220" height="140" rx="16" fill="#e8f1fb" stroke="#1f2328" stroke-width="2"/><g transform="translate(1408.0,210) scale(1.8333333333333333)" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l18 0" /> <path d="M5 7a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -8" /></g><text x="1430.0" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Desktop app</text><text x="1430.0" y="306" text-anchor="middle" font-size="14" fill="#59636e">laptop, notebooks</text><polyline points="260,268 338,268" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="299" y="248" text-anchor="middle" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">HTTPS</text><text x="299" y="296" text-anchor="middle" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">tunnel</text><polyline points="560,268 638,268" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="599" y="248" text-anchor="middle" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">audio</text><text x="599" y="296" text-anchor="middle" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">reply</text><polyline points="860,235 998,130" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="915" y="150" text-anchor="end" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">redacted text,</text><text x="915" y="170" text-anchor="end" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">camera frame</text><polyline points="860,300 998,390" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="915" y="395" text-anchor="end" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">checked reply</text><polyline points="1318,225 1222,130" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="1272" y="142" text-anchor="start" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">its own questions,</text><text x="1272" y="162" text-anchor="start" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">no gate yet</text><polyline points="1318,295 1222,390" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><text x="1272" y="382" text-anchor="start" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">each sentence</text><polyline points="450,330 450,560 1430,560 1430,332" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#head)"/><text x="940" y="550" text-anchor="middle" font-size="16" fill="#1f2328" stroke="#ffffff" stroke-width="5" paint-order="stroke">pulls each saved turn over SSH, every 60 s</text></svg>
