<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 770" width="1480" height="770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The guard proxy. The spoken question stays on the rover: Whisper turns it into text and the guard proxy removes personal information, so Gemini receives only clean text and a camera frame. The proxy checks the answer before ElevenLabs speaks it. Questions asked in the desktop app reach Gemini as recorded, because the proxy does not cover them yet."><title>The guard proxy. The spoken question stays on the rover: Whisper turns it into text and the guard proxy removes personal information, so Gemini receives only clean text and a camera frame. The proxy checks the answer before ElevenLabs speaks it. Questions asked in the desktop app reach Gemini as recorded, because the proxy does not cover them yet.</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs><rect width="1480" height="770" fill="#ffffff"/><rect x="250" y="20" width="1210" height="230" rx="20" fill="#fff4e0"/><text x="270" y="50" font-size="15" font-weight="700" letter-spacing="0.6" fill="#8a5a00">SENT TO REMOTE SERVICES</text><rect x="250" y="280" width="1210" height="230" rx="20" fill="#e9f5ec"/><text x="270" y="310" font-size="15" font-weight="700" letter-spacing="0.6" fill="#1a7f37">STAYS ON THE ROVER</text><rect x="20" y="560" width="1440" height="190" rx="20" fill="#fdeceb"/><text x="40" y="590" font-size="15" font-weight="700" letter-spacing="0.6" fill="#b42318">DESKTOP APP QUESTIONS: NO 